<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Helvetica, Arial, sans-serif">

  <!-- Client Layer -->
  <rect x="40" y="20" width="640" height="90" rx="6" fill="#f0f4f8" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="42" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">MCP Client Layer</text>
  <rect x="70"  y="54" width="160" height="40" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="150" y="78" text-anchor="middle" font-size="11" fill="#1e293b">Claude Desktop</text>
  <rect x="280" y="54" width="160" height="40" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#1e293b">Python Async Client</text>
  <rect x="490" y="54" width="160" height="40" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <text x="570" y="78" text-anchor="middle" font-size="11" fill="#1e293b">VS Code Copilot</text>

  <!-- Protocol arrow -->
  <line x1="360" y1="110" x2="360" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="135" font-size="9" fill="#64748b">MCP Protocol (stdio)</text>

  <!-- Server Layer -->
  <rect x="40" y="150" width="640" height="220" rx="6" fill="#eef2ff" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">DatabricksMCPServer (server.py)</text>

  <!-- Handlers -->
  <rect x="70"  y="186" width="180" height="50" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="160" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#4f46e5">ToolHandler</text>
  <text x="160" y="223" text-anchor="middle" font-size="9" fill="#64748b">tools.py — 7 tools</text>

  <rect x="270" y="186" width="180" height="50" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="360" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#4f46e5">ResourceHandler</text>
  <text x="360" y="223" text-anchor="middle" font-size="9" fill="#64748b">resources.py — 3 URIs</text>

  <rect x="470" y="186" width="180" height="50" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="560" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#4f46e5">PromptHandler</text>
  <text x="560" y="223" text-anchor="middle" font-size="9" fill="#64748b">prompts.py — 3 templates</text>

  <!-- Support layer -->
  <rect x="70" y="256" width="280" height="50" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="210" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">ProgressReporter</text>
  <text x="210" y="293" text-anchor="middle" font-size="9" fill="#64748b">progress.py — notifications/progress</text>

  <rect x="370" y="256" width="280" height="50" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="510" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c3aed">Pydantic Models</text>
  <text x="510" y="293" text-anchor="middle" font-size="9" fill="#64748b">pydantic_models.py — validation &amp; schemas</text>

  <!-- Dashed progress arrow back to clients -->
  <line x1="100" y1="256" x2="100" y2="110" stroke="#7c3aed" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="110" y="185" font-size="8" fill="#7c3aed" transform="rotate(-90, 110, 185)">progress events</text>

  <!-- SDK arrow -->
  <line x1="360" y1="370" x2="360" y2="410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="370" y="395" font-size="9" fill="#64748b">SDK Calls</text>

  <!-- External Services -->
  <rect x="40" y="410" width="640" height="90" rx="6" fill="#f0fdf4" stroke="#334155" stroke-width="1.5"/>
  <text x="360" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#334155">External Services</text>
  <rect x="70"  y="444" width="180" height="42" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="160" y="462" text-anchor="middle" font-size="10" fill="#1e293b">Databricks</text>
  <text x="160" y="476" text-anchor="middle" font-size="9" fill="#64748b">Unity Catalog + SQL WH</text>

  <rect x="270" y="444" width="180" height="42" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="360" y="462" text-anchor="middle" font-size="10" fill="#1e293b">Anthropic Claude</text>
  <text x="360" y="476" text-anchor="middle" font-size="9" fill="#64748b">NL → SQL translation</text>

  <rect x="470" y="444" width="180" height="42" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
  <text x="560" y="462" text-anchor="middle" font-size="10" fill="#1e293b">Plotly</text>
  <text x="560" y="476" text-anchor="middle" font-size="9" fill="#64748b">Charts → Base64 PNG</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
